name: Deploy production

# Manual-only, main only: pushing to a branch does NOT deploy by itself, and
# dispatching this workflow against anything other than main is a no-op (see
# the job-level `if` below) — the "Use workflow from" dropdown doesn't stop
# you from picking another branch, so we guard against it explicitly.
on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, xendelta]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Build and restart
        env:
          VITE_BUGSNAG_API_KEY: ${{ secrets.VITE_BUGSNAG_API_KEY }}
          VITE_BUGSNAG_RELEASE_STAGE: production
        run: |
          set -euo pipefail
          cd ~/XenHub-Prod
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          SHA=$(git rev-parse HEAD)
          npm ci
          VITE_BUGSNAG_APP_VERSION="$SHA" npm run build
          npx bugsnag-source-maps upload-browser \
            --api-key "$VITE_BUGSNAG_API_KEY" \
            --app-version "$SHA" \
            --directory ./dist \
            --base-url "https://xendelta.com/"
          find dist -name "*.map" -delete
          pm2 restart xenhub-prod
          echo "Deployed $SHA to production"
