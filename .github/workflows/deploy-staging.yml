name: Deploy staging

# Manual-only: pushing to a branch does NOT deploy by itself. Run this on
# purpose (Actions tab -> Run workflow, or `gh workflow run deploy-staging.yml`),
# picking the branch to deploy via the "Use workflow from" selector.
on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, xendelta]
    steps:
      - name: Build and restart
        env:
          VITE_BUGSNAG_API_KEY: ${{ secrets.VITE_BUGSNAG_API_KEY }}
          VITE_BUGSNAG_RELEASE_STAGE: staging
        run: |
          set -euo pipefail
          cd ~/XenHub-Staging
          git fetch origin ${{ github.ref_name }}
          git checkout ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}
          SHA=$(git rev-parse HEAD)
          npm ci
          VITE_BUGSNAG_APP_VERSION="$SHA" npm run build
          npx bugsnag-source-maps upload-browser \
            --api-key "$VITE_BUGSNAG_API_KEY" \
            --app-version "$SHA" \
            --directory ./dist \
            --base-url "https://staging.xendelta.com/"
          find dist -name "*.map" -delete
          pm2 restart xenhub-staging
          echo "Deployed $SHA (branch ${{ github.ref_name }}) to staging"
