<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Note dialog on phone</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>

</head>
<body>


<div style="width:390px;height:844px;box-sizing:border-box;background:#ffffff;font-family:Roboto,system-ui,sans-serif;color:#212121;font-size:14px;display:flex;flex-direction:column">
<div style="height:56px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px;border-bottom:1px solid #e0e0e0">
<span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#212121" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></span>
<span style="flex:1;color:#5f6368;font-size:13px">Saved</span>
<span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="2" aria-hidden="true"><path d="M6 17V11a6 6 0 0112 0v6l2 2H4zM10 21h4"/></svg></span>
<span style="height:36px;padding:0 16px;border-radius:6px;border:1px solid #1565c0;color:#1565c0;font-weight:500;display:flex;align-items:center;margin-right:4px">Done</span>
</div>
<div style="flex:1;padding:16px;display:flex;flex-direction:column;gap:12px;overflow:hidden">
<div style="font-size:26px;font-weight:600;letter-spacing:-0.01em">Weekend plans</div>
<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#5f6368"><span style="padding:3px 10px;border-radius:999px;border:1px solid #e0e0e0">home</span><span style="padding:3px 10px;border-radius:999px;border:1px solid #e0e0e0">food</span></div>
<div style="font-size:20px;font-weight:600">Saturday</div>
<div style="font-size:16px;line-height:1.6">Market in the morning, then lunch with <span style="color:#1565c0;border-bottom:1px solid #1565c0">Anna's birthday</span>.</div>
<div style="display:flex;gap:10px;align-items:center;font-size:16px"><span style="width:22px;height:22px;box-sizing:border-box;border:2px solid #1565c0;border-radius:4px;background:#1565c0;flex:none"></span><span style="text-decoration:line-through;color:#5f6368">Buy flowers</span></div>
<div style="display:flex;gap:10px;align-items:center;font-size:16px"><span style="width:22px;height:22px;box-sizing:border-box;border:2px solid #5f6368;border-radius:4px;flex:none"></span>Book the table<span style="display:inline-block;width:2px;height:20px;background:#1565c0"></span></div>
</div>
<div style="flex:none;height:48px;border-top:1px solid #e0e0e0;background:#f6f7f9;display:flex;align-items:center;justify-content:space-around;padding:0 8px">
<span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px">B</span>
<span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:16px">☑</span>
<span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#1565c0">[[</span>
<span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:14px">Label</span>
<span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:14px">Photo</span>
<span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600">/</span>
</div>
<div style="flex:none;height:260px;background:#d3d6db;display:flex;align-items:center;justify-content:center;color:#5f6368">On-screen keyboard</div>
</div>

</body>
</html>
