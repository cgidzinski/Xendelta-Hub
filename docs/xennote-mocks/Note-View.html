<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Note dialog, view mode</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>

</head>
<body>


<div style="width:720px;height:800px;box-sizing:border-box;background:#f6f7f9;font-family:Roboto,system-ui,sans-serif;color:#212121;font-size:14px;padding:24px">
<div style="height:100%;box-sizing:border-box;border:1px solid #e0e0e0;border-radius:10px;background:#ffffff;display:flex;flex-direction:column;overflow:hidden">
<div style="height:56px;flex:none;display:flex;align-items:center;gap:4px;padding:0 12px 0 20px;border-bottom:1px solid #e0e0e0">
<span style="flex:1;color:#5f6368;font-size:13px">Groceries and plans</span>
<span style="width:40px;height:40px;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="#b45309" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></span>
<span style="width:40px;height:40px;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="2" aria-hidden="true"><path d="M6 17V11a6 6 0 0112 0v6l2 2H4zM10 21h4"/></svg></span>
<span style="width:40px;height:40px;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="2" aria-hidden="true"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8 11l8-4M8 13l8 4"/></svg></span>
<span style="width:40px;height:40px;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="#5f6368" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></span>
<span style="margin-left:4px;height:36px;padding:0 18px;border-radius:6px;background:#1565c0;color:#ffffff;font-weight:500;display:flex;align-items:center">Edit</span>
</div>
<div style="flex:1;padding:28px 40px;display:flex;flex-direction:column;gap:12px;overflow:hidden">
<div style="font-size:30px;font-weight:600;letter-spacing:-0.01em">Weekend plans</div>
<div style="display:flex;align-items:center;gap:8px;font-size:12px;color:#5f6368"><span style="padding:3px 10px;border-radius:999px;border:1px solid #e0e0e0">home</span><span style="padding:3px 10px;border-radius:999px;border:1px solid #e0e0e0">food</span><span>Edited by you, 2 hours ago</span></div>
<div style="font-size:20px;font-weight:600;margin-top:6px">Saturday</div>
<div style="font-size:16px;line-height:1.6">Market in the morning, then lunch with <span style="color:#1565c0;border-bottom:1px solid #1565c0">Anna's birthday</span>. Ideas for the cake are in <span style="color:#1565c0;border-bottom:1px solid #1565c0">Recipes</span>.</div>
<div style="display:flex;gap:10px;align-items:center;font-size:16px"><span style="width:20px;height:20px;box-sizing:border-box;border:2px solid #1565c0;border-radius:4px;background:#1565c0"></span><span style="text-decoration:line-through;color:#5f6368">Buy flowers</span></div>
<div style="display:flex;gap:10px;align-items:center;font-size:16px"><span style="width:20px;height:20px;box-sizing:border-box;border:2px solid #5f6368;border-radius:4px"></span>Book the table</div>
<div style="display:flex;gap:8px;margin-top:4px"><div style="width:120px;height:84px;border-radius:8px;background:#dfe6ee"></div><div style="width:120px;height:84px;border-radius:8px;background:#e6e1d6"></div></div>
<div style="margin-top:10px;border-top:1px solid #e0e0e0;padding-top:12px;display:flex;flex-direction:column;gap:8px">
<div style="font-size:11px;font-weight:600;letter-spacing:0.08em;color:#5f6368">LINKED FROM</div>
<div style="display:flex;gap:8px"><span style="padding:5px 12px;border:1px solid #e0e0e0;border-radius:999px">Shopping list</span></div>
<div style="font-size:11px;font-weight:600;letter-spacing:0.08em;color:#5f6368;margin-top:4px">MENTIONS THIS NOTE</div>
<div style="display:flex;align-items:center;gap:10px;border:1px solid #e0e0e0;border-radius:8px;padding:8px 12px"><span style="flex:1;font-size:13px">Trip ideas: …the <b>Weekend plans</b> are set…</span><span style="color:#1565c0;font-weight:500;font-size:13px">Link it</span></div>
</div>
</div>
</div>
</div>
