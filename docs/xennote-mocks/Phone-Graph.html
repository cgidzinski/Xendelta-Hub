<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone graph 2D</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>

</head>
<body>


<div style="width:390px;height:844px;box-sizing:border-box;background:#0f1722;font-family:Roboto,system-ui,sans-serif;color:#e8eaed;font-size:14px;position:relative;overflow:hidden">
<svg width="390" height="844" viewBox="0 0 390 844" style="position:absolute;left:0;top:0" role="img" aria-label="Two-dimensional graph of pages and tags">
<g stroke="#8ab4f8" stroke-opacity="0.4" stroke-width="1.2" fill="none">
<path d="M195 400L120 310M195 400L270 320M195 400L150 500M195 400L260 490M120 310L70 240M120 310L60 360M270 320L330 270M150 500L90 580M260 490L320 560M270 320L320 390"/>
</g>
<circle cx="195" cy="400" r="12" fill="#8ab4f8"/>
<circle cx="120" cy="310" r="8" fill="#8ab4f8"/>
<circle cx="270" cy="320" r="8" fill="#81c995"/>
<circle cx="150" cy="500" r="9" fill="#81c995"/>
<circle cx="260" cy="490" r="7" fill="#fdd663"/>
<circle cx="70" cy="240" r="5" fill="#8ab4f8"/>
<circle cx="60" cy="360" r="5" fill="#8ab4f8"/>
<circle cx="330" cy="270" r="5" fill="#81c995"/>
<circle cx="90" cy="580" r="5" fill="#fdd663"/>
<circle cx="320" cy="560" r="5" fill="#fdd663"/>
<circle cx="320" cy="390" r="6" fill="#81c995"/>
<rect x="225" y="350" width="10" height="10" transform="rotate(45 230 355)" fill="#c58af9"/>
<g font-family="Roboto, sans-serif" font-size="12" fill="#e8eaed"><text x="150" y="426">Q4 planning</text><text x="96" y="296">Risk register</text></g>
</svg>
<div style="position:absolute;left:0;top:0;right:0;height:56px;display:flex;align-items:center;gap:8px;padding:0 8px;background:#1c2736;border-bottom:1px solid #33425a">
<span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e8eaed" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></span>
<div style="flex:1;font-size:18px;font-weight:600">Graph: Work</div>
<div style="height:36px;padding:0 4px;border-radius:6px;border:1px solid #33425a;display:flex;align-items:center;gap:2px"><span style="height:28px;padding:0 12px;border-radius:4px;background:#2196f3;color:#ffffff;font-weight:500;display:flex;align-items:center">2D</span><span style="height:28px;padding:0 12px;display:flex;align-items:center;color:#9aa0a6">3D</span></div>
</div>
<div style="position:absolute;left:16px;right:16px;bottom:24px;border:1px solid #33425a;border-radius:8px;background:#1c2736;padding:14px 16px;display:flex;flex-direction:column;gap:8px">
<div style="font-weight:600;font-size:16px">Q4 planning kickoff</div>
<div style="font-size:12px;color:#9aa0a6">Meetings, 6 links, 2 tags</div>
<div style="display:flex;gap:8px"><span style="flex:1;height:44px;border-radius:6px;background:#2196f3;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:500">Open page</span><span style="height:44px;padding:0 16px;border-radius:6px;border:1px solid #33425a;display:flex;align-items:center">Filters</span></div>
</div>
</div>

</body>
</html>
