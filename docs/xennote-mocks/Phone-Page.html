<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone page editor</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>

</head>
<body>


<div style="width:390px;height:844px;box-sizing:border-box;background:#ffffff;font-family:Roboto,system-ui,sans-serif;color:#212121;font-size:14px;display:flex;flex-direction:column;position:relative">
<div style="height:56px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px;border-bottom:1px solid #e0e0e0">
<span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#212121" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></span>
<div style="flex:1;font-size:13px;color:#5f6368">Work / Meetings</div>
<span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="#b45309" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></span>
<span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="#212121" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></span>
</div>
<div style="flex:1;padding:16px;display:flex;flex-direction:column;gap:12px;overflow:hidden">
<div style="font-size:26px;font-weight:600;letter-spacing:-0.01em">Q4 planning kickoff</div>
<div style="display:flex;gap:6px;font-size:12px;color:#5f6368"><span style="padding:3px 10px;border-radius:999px;border:1px solid #e0e0e0">#planning</span><span style="padding:3px 10px;border-radius:999px;border:1px solid #e0e0e0">#q4</span></div>
<div style="font-size:20px;font-weight:600;margin-top:4px">Agenda</div>
<div style="display:flex;gap:10px;align-items:center;font-size:16px"><span style="width:22px;height:22px;box-sizing:border-box;border:2px solid #1565c0;border-radius:4px;background:#1565c0;flex:none"></span><span style="text-decoration:line-through;color:#5f6368">Confirm owners</span></div>
<div style="display:flex;gap:10px;align-items:center;font-size:16px"><span style="width:22px;height:22px;box-sizing:border-box;border:2px solid #5f6368;border-radius:4px;flex:none"></span><span>Review the <span style="color:#1565c0;border-bottom:1px solid #1565c0">Risk register</span></span></div>
<div style="border:1px solid #e0e0e0;border-radius:8px;background:#fff7e6;padding:12px;font-size:15px;line-height:1.5"><b>Decision needed.</b> Ship the import tool in Q4 only if design signs off by the 28th.</div>
<div style="font-size:16px;color:#5f6368">Type / for blocks<span style="display:inline-block;width:2px;height:18px;background:#1565c0;vertical-align:text-bottom;margin-left:2px"></span></div>
</div>
<!-- keyboard toolbar -->
<div style="flex:none;height:48px;border-top:1px solid #e0e0e0;background:#f6f7f9;display:flex;align-items:center;justify-content:space-around;padding:0 8px">
<span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px">B</span>
<span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-style:italic;font-size:16px">I</span>
<span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:16px">☑</span>
<span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#1565c0">[[</span>
<span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#1565c0">#</span>
<span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:16px">⎘</span>
<span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600">/</span>
</div>
<div style="flex:none;height:260px;background:#d3d6db;display:flex;align-items:center;justify-content:center;color:#5f6368">On-screen keyboard</div>
</div>

</body>
</html>
